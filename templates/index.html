<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Crypto Dashboard</title>

    <!-- Link to CSS file -->
    <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
    
    <!-- Favicon (Browser Tab Icon) -->
    <link rel="icon" type="image/png" href="{{ url_for('static', path='icon.png') }}">
</head>
<body>
    
    <!-- Header with Logo and Title -->
    <div style="display: flex; align-items: center; gap: 15px;">
        <img src="{{ url_for('static', path='icon.png') }}" alt="Coin Watcher Logo" width="50" height="50">
        <h1 style="margin: 0;">Live Cryptocurrency Prices</h1>
    </div>

    <!-- Last Updated Timestamp -->
    <div class="timestamp-container">
        <span class="timestamp-text">
            Last Updated: <strong id="last-updated">{{ time }}</strong>
        </span>
    </div>
    
    <table border="1" cellpadding="10" cellspacing="0">
        <thead>
            <tr>
                <th>Coin Name</th>
                <th>Price (USD)</th>
            </tr>
        </thead>
        <tbody>
            <!-- Jinja2 Loop over the dictionary -->
            {% for coin_name, coin_price in prices.items() %}
            <tr>
                <td>{{ coin_name | capitalize }}</td>
                <td id="price-{{ coin_name }}">{{ coin_price }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

    <!-- Auto-refresh Script (AJAX) -->
    <script>
        setInterval(async function() {
            try {
                let response = await fetch('/api/prices');
                let data = await response.json();
                
                if (data.status === "success") {
                    // Update timestamp
                    let timeElement = document.getElementById("last-updated");
                    if (timeElement) timeElement.innerText = data.time;
                    
                    // Update prices
                    for (const [coin, price] of Object.entries(data.prices)) {
                        let priceElement = document.getElementById("price-" + coin);
                        if (priceElement) {
                            priceElement.innerText = price;
                        }
                    }
                }
            } catch (error) {
                console.error("Error updating prices:", error);
            }
        }, 180000); // 180000 ms = 3 minutes
    </script>
</body>
</html>
